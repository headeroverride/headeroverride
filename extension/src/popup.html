<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Header Override</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app">
      <header class="toolbar">
        <div class="brand">
          <img src="../icons/icon-32.png" alt="" aria-hidden="true">
          <h1>Header Override</h1>
          <label class="master-toggle" title="Enable or pause all rules">
            <input id="global-rules-toggle" type="checkbox" aria-label="All rules enabled" checked>
          </label>
          <div id="host-access-control" class="host-access-control" hidden>
            <button
              id="host-access-trigger"
              class="host-access-trigger"
              type="button"
              title="No persistent website access"
              aria-label="No persistent website access"
              aria-haspopup="dialog"
              aria-controls="host-access-popover"
              aria-expanded="false"
            >
              <span aria-hidden="true">!</span>
            </button>
            <div
              id="host-access-popover"
              class="host-access-popover"
              role="dialog"
              aria-label="Website access"
              hidden
            >
              <strong>Website access needed</strong>
              <p id="host-access-message">Allow specific sites in browser settings or grant all websites.</p>
              <button id="grant-host-access" type="button">Grant all websites</button>
            </div>
          </div>
        </div>
        <div class="profile-menu">
          <span id="profile-current" class="profile-current"></span>
          <button
            id="profile-menu-button"
            class="icon-button menu-button"
            type="button"
            title="Profiles"
            aria-label="Profiles"
            aria-haspopup="menu"
            aria-expanded="false"
          >
            <span aria-hidden="true"></span>
          </button>
          <div id="profile-menu" class="profile-menu-panel" role="menu" hidden>
            <div class="profile-menu-heading">
              <span>Profiles</span>
              <button class="profile-add-button" type="button" aria-label="Add profile">+</button>
            </div>
          </div>
        </div>
      </header>

      <div class="tabs-row">
        <nav class="tabs" aria-label="Rule type">
          <button class="tab is-active" type="button" data-tab="headers">
            <span class="tab-label">Headers</span>
            <span class="tab-count" data-count="headers">0</span>
          </button>
          <button class="tab" type="button" data-tab="cookies">
            <span class="tab-label">Cookies</span>
            <span class="tab-count" data-count="cookies">0</span>
          </button>
        </nav>
        <button
          id="sticky-section-add-button"
          class="section-add-button tabs-add-button"
          type="button"
          data-action="add-rule"
          aria-label="Add rule"
          title="Add rule"
          hidden
        >+</button>
      </div>

      <section class="rules-shell" aria-label="Override rules">
        <div id="rules" class="rules"></div>
      </section>

      <footer class="app-footer">
        <a
          class="about-link"
          href="https://headeroverride.com/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="About Header Override — headeroverride.com (opens in a new tab)"
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M15 3h6v6M10 14 21 3M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/>
          </svg>
          <span>About</span>
        </a>
      </footer>
    </main>

    <template id="url-help-template">
      <span class="url-heading">
        <button
          type="button"
          class="help-tip"
          aria-label="URL filter syntax examples"
          aria-expanded="false"
        >
          ?
        </button>
        <span class="help-panel" role="tooltip">
          <span class="help-title">URL filter syntax</span>
          <span class="help-grid">
            <span class="help-grid-head">urlFilter</span>
            <span class="help-grid-head">Matches</span>
            <span class="help-grid-head">Does not match</span>

            <code>|https*</code>
            <span>https://example.com</span>
            <span>http://example.com<br>http://https.com</span>

            <code>*example.com*</code>
            <span>https://api.example.com/users</span>
            <span>https://example.org</span>

            <code>*api.example.com/users/*</code>
            <span>https://api.example.com/users/123</span>
            <span>https://api.example.com/projects/123</span>
          </span>
          <ul class="help-legend">
            <li><code>|</code> at the start: URL starts with the filter. At the end: URL ends with it.</li>
            <li><code>*</code> means any characters.</li>
          </ul>
        </span>
      </span>
    </template>

    <template id="url-filter-popover-template">
      <div class="url-filter-popover" role="dialog" aria-label="URL filter" hidden>
        <div class="url-filter-popover-title">
          <label>URL filter</label>
          <span class="url-filter-help-slot"></span>
          <button class="url-filter-close" type="button" aria-label="Close URL filter">×</button>
        </div>
        <div class="url-filter-options" role="group" aria-label="URL scope">
          <button type="button" data-url-scope="all" aria-pressed="false">All websites</button>
          <button type="button" data-url-scope="custom" aria-pressed="false">Custom URL</button>
        </div>
        <div class="url-filter-editor-row">
          <div class="url-filter-custom">
            <input class="url-filter" type="text" placeholder="|http*" title="URL filter" aria-label="URL filter" spellcheck="false" autocomplete="off">
          </div>
          <button class="url-filter-done" type="button">Done</button>
        </div>
      </div>
    </template>

    <template id="header-rule-template">
      <article class="rule header-rule">
        <div class="rule-main header-rule-main">
          <button class="drag-handle" type="button"></button>
          <input class="enabled" type="checkbox" title="Enabled" aria-label="Enabled">
          <span class="operation-field header-field">
            <button class="operation-toggle" type="button" title="Response header operation: Set" aria-label="Response header operation: Set">=</button>
            <input class="header" type="text" placeholder="Header" title="Header" aria-label="Header">
          </span>
          <span class="value-shell">
            <input class="value" type="text" placeholder="Value" title="Value" aria-label="Value">
          </span>
          <input class="comment" type="text" placeholder="Comment" title="Comment" aria-label="Comment">
          <button class="url-filter-trigger" type="button" title="URL filter" aria-label="URL filter" aria-haspopup="dialog" aria-expanded="false">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M4 5h16l-6.5 7.5V19l-3-1.5v-5L4 5Z"/>
            </svg>
          </button>
          <button class="delete icon-button" title="Delete rule" aria-label="Delete rule">x</button>
        </div>
      </article>
    </template>

    <template id="cookie-rule-template">
      <article class="rule cookie-rule">
        <div class="cookie-row cookie-primary">
          <button class="drag-handle" type="button"></button>
          <input class="enabled" type="checkbox" title="Enabled" aria-label="Enabled">
          <span class="operation-field name-field">
            <button class="operation-toggle" type="button" title="Response cookie operation: Add" aria-label="Response cookie operation: Add">+</button>
            <input class="name" type="text" placeholder="Name" title="Cookie name" aria-label="Cookie name">
          </span>
          <span class="value-shell">
            <input class="value" type="text" placeholder="Value" title="Cookie value" aria-label="Cookie value">
          </span>
          <input class="comment" type="text" placeholder="Comment" title="Comment" aria-label="Comment">
          <button class="url-filter-trigger" type="button" title="URL filter" aria-label="URL filter" aria-haspopup="dialog" aria-expanded="false">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M4 5h16l-6.5 7.5V19l-3-1.5v-5L4 5Z"/>
            </svg>
          </button>
          <button class="delete icon-button" title="Delete rule" aria-label="Delete rule">x</button>
        </div>
        <div class="cookie-row cookie-response-fields">
          <span></span>
          <div class="cookie-detail-shell">
            <div class="detail-summary">
              <button class="detail-toggle" type="button">Edit</button>
              <span class="detail-summary-text"></span>
            </div>
            <div class="cookie-details detail-editor">
              <button class="detail-done" type="button">Done</button>
              <label class="detail-field detail-field-medium">
                <span>Domain</span>
                <input class="domain" type="text" placeholder="Optional" title="Domain" aria-label="Domain">
              </label>
              <label class="detail-field detail-field-short">
                <span>Path</span>
                <input class="path" type="text" placeholder="/" title="Path" aria-label="Path">
              </label>
              <label class="detail-field detail-field-short">
                <span>SameSite</span>
                <select class="same-site" title="SameSite" aria-label="SameSite">
                  <option value="lax">Lax</option>
                  <option value="strict">Strict</option>
                  <option value="no_restriction">None</option>
                </select>
              </label>
              <label class="detail-field detail-field-short">
                <span>Lifetime</span>
                <select class="session" title="Lifetime" aria-label="Lifetime">
                  <option value="true">Session</option>
                  <option value="false">Persistent</option>
                </select>
              </label>
              <label class="detail-field detail-field-max-age">
                <span>Max-Age</span>
                <input class="max-age" type="number" min="1" step="1" placeholder="2592000" title="Max-Age seconds" aria-label="Max-Age seconds">
              </label>
              <label class="detail-check">
                <input class="secure" type="checkbox">
                <span>Secure</span>
              </label>
            </div>
          </div>
        </div>
      </article>
    </template>

    <script src="popup.js"></script>
  </body>
</html>
