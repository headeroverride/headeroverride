name: Browser channel E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Chrome ${{ matrix.channel }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        channel:
          - stable
          - beta
          - dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser system dependencies
        run: npx playwright install-deps chromium

      - name: Run ${{ matrix.channel }} E2E tests
        run: npm run test:e2e:${{ matrix.channel }} -- --headless

      - name: Upload Playwright results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.channel }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
